<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Listen on TRadio</title>
  <meta name="description" content="Someone shared a radio station with you. Listen live on TRadio — world radio on a 3D globe.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="TRadio">
  <meta property="og:title" content="Listen on TRadio">
  <meta property="og:description" content="Someone shared a radio station with you. Listen live on TRadio — world radio on a 3D globe.">
  <meta property="og:image" content="https://mufwaya2025.github.io/og-image.png">
  <meta name="twitter:card" content="summary">
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #0b1220; color: #e6edf6;
           min-height: 100vh; display: grid; place-items: center; text-align: center; }
    main { padding: 2rem; max-width: 28rem; }
    img.logo { width: 96px; height: 96px; border-radius: 22%; }
    h1 { margin: 1rem 0 0.25rem; }
    p { color: #9fb0c6; line-height: 1.5; }
    a.open, a.store { display: inline-block; margin: 0.5rem 0.25rem 0; padding: 0.8rem 1.6rem;
                      border-radius: 999px; font-weight: 700; text-decoration: none; }
    a.open { background: #38bdf8; color: #06131c; }
    a.store { background: #22c55e; color: #04110a; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/og-image.png" alt="TRadio logo">
    <h1>Listen on TRadio</h1>
    <p id="blurb">Someone shared a radio station with you.</p>
    <a class="open" id="open-app" href="https://play.google.com/store/apps/details?id=com.tradio.radio">Open in TRadio</a>
    <a class="store" href="https://play.google.com/store/apps/details?id=com.tradio.radio">Get it on Google Play</a>
  </main>
  <script>
    // If TRadio is installed, this intent:// link opens it on the shared station;
    // otherwise Android sends the user to the Play Store listing.
    var id = new URLSearchParams(location.search).get('id');
    if (id) {
      document.getElementById('open-app').href =
        'intent://mufwaya2025.github.io/s/?id=' + encodeURIComponent(id) +
        '#Intent;scheme=https;package=com.tradio.radio;end';
    }
  </script>
</body>
</html>
